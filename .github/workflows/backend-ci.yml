name: Backend CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: e_auction_dev
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: auction_user
          MYSQL_PASSWORD: auction_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/e_auction_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
          DB_USERNAME: auction_user
          DB_PASSWORD: auction_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret
          RAZORPAY_KEY_ID: test-key
          RAZORPAY_KEY_SECRET: test-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
        run: ./mvnw test

      - name: Build Spring Boot application
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/e_auction_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
          DB_USERNAME: auction_user
          DB_PASSWORD: auction_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret
          RAZORPAY_KEY_ID: test-key
          RAZORPAY_KEY_SECRET: test-secret
          RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
        run: ./mvnw clean package -DskipTests